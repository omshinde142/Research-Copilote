random_seed: 42
data:
  sample_size: 16500
  prefix: cs.
  from_year: 2024
  to_year: 2026
  history_years:
  - 2020
  - 2021
  - 2022
  - 2023
  recent_per_month: 300
  history_per_month: 115
  min_train_class_count: 20
  snapshot_file: data/arxiv-metadata-oai-snapshot.json
  cache_file: data/arxiv_true_cache.jsonl
  papers_file: data/papers.pkl
  splits_file: data/splits.json
  report_file: data/data_report.json
  clusters_file: data/clusters.json
  index_file: data/index.faiss
  metrics_file: data/metrics.json
  date_boundaries:
    val_start: '2026-05-01'
    test_start: '2026-08-01'
embedding:
  model_name: all-MiniLM-L6-v2
  fine_tuned_path: data/models/embedder-ft
  active_model: fine_tuned
  batch_size: 64
  normalize: true
umap:
  n_neighbors: 15
  min_dist_2d: 0.1
  min_dist_5d: 0.0
  metric: cosine
clustering:
  min_cluster_ratio: 800
  min_cluster_floor: 15
search:
  dense_top_k: 50
  sparse_top_k: 50
  fused_top_k: 30
  final_top_k: 8
  reranker_model: cross-encoder/ms-marco-MiniLM-L-6-v2
  rrf_k: 60
  min_score: -5.0
